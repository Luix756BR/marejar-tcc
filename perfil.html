<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Meu Perfil - Marejar</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <!-- Perfil Custom Stylesheet -->
    <link href="css/style_perfil.css" rel="stylesheet">
</head>

<body>

    <!-- Header Simples de Navegação -->
    <header class="fixed-top bg-white shadow-sm">
        <div class="container-fluid position-relative p-0">
            <nav class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3 py-lg-0">
                <a href="index.html" class="navbar-brand p-0">
                    <h1 class="m-0"><i class="fa fa-map-marker-alt me-3"></i>Marejar</h1>
                </a>
                <div class="ms-auto d-flex align-items-center">
                    <a href="index.html" class="btn btn-outline-primary rounded-pill px-4 py-2"><i class="fa fa-home me-2"></i>Voltar ao Início</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal do Perfil -->
    <main class="profile-main-container">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <!-- Topo do Card de Perfil -->
                        <div class="card-header bg-primary text-white p-4 d-flex align-items-center gap-3">
                            <div class="profile-avatar-lg" id="userAvatar">U</div>
                            <div>
                                <h3 class="mb-1 text-white" id="userName">Carregando...</h3>
                                <p class="mb-0 text-white-50" id="userEmail">carregando...</p>
                                <span class="badge bg-light text-primary mt-2 px-3 py-1 rounded-pill fw-semibold" id="userRole">Turista</span>
                            </div>
                        </div>

                        <!-- Corpo com as Informações -->
                        <div class="card-body p-4 p-md-5 bg-white">
                            <h5 class="text-uppercase text-muted fw-bold fs-6 mb-4">Informações da Conta</h5>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded-3 border">
                                        <small class="text-muted d-block fw-bold mb-1">CPF</small>
                                        <span class="fw-semibold text-dark" id="userCpf">-</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded-3 border">
                                        <small class="text-muted d-block fw-bold mb-1">Telefone</small>
                                        <span class="fw-semibold text-dark" id="userPhone">-</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded-3 border">
                                        <small class="text-muted d-block fw-bold mb-1">Data de Nascimento</small>
                                        <span class="fw-semibold text-dark" id="userBirth">-</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="p-3 bg-light rounded-3 border">
                                        <small class="text-muted d-block fw-bold mb-1">Cidade</small>
                                        <span class="fw-semibold text-dark" id="userCity">-</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Botões de Ação -->
                            <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                                <button onclick="fazerLogout()" class="btn btn-outline-danger px-4 py-2 rounded-pill"><i class="fa fa-sign-out-alt me-2"></i>Sair da Conta</button>
                                <button onclick="alert('Funcionalidade de edição em desenvolvimento.')" class="btn btn-primary px-4 py-2 rounded-pill"><i class="fa fa-edit me-2"></i>Editar Perfil</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Perfil Script -->
    <script src="js/perfil.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const navbar = document.querySelector('.navbar');
    if (!navbar) return;
    const updateNavbar = function () {
        navbar.classList.toggle('sticky-top', window.scrollY > 45);
        navbar.classList.toggle('shadow-sm', window.scrollY > 45);
    };
    updateNavbar();
    window.addEventListener('scroll', updateNavbar, { passive: true });
});
</script>
</body>

</html>
